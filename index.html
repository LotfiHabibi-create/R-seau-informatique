<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Informatique — Prof. Lotfi Habibi</title>
<style>
  :root{
    --navy:#2b2f7e;
    --navy-dark:#1d2059;
    --gold:#e0b84b;
    --bg:#f2f3fb;
    --card:#ffffff;
    --green:#3bb273;
    --red:#e15554;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:linear-gradient(160deg,#eef0fb 0%,#dfe3f7 100%);
    color:#20224a;
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--navy);
    color:#fff;
    padding:14px 20px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
  }
  header img{
    height:54px;
    width:54px;
    border-radius:50%;
    background:#fff;
    padding:4px;
  }
  header .titles h1{
    margin:0;
    font-size:1.2rem;
  }
  header .titles p{
    margin:2px 0 0;
    font-size:.85rem;
    color:var(--gold);
  }
  main{
    max-width:1000px;
    margin:0 auto;
    padding:20px;
  }
  .panel{
    background:var(--card);
    border-radius:14px;
    padding:18px 20px;
    box-shadow:0 4px 16px rgba(30,30,90,.08);
    margin-bottom:20px;
  }
  h2{margin-top:0;color:var(--navy-dark);}
  .teams{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .team-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--bg);
    border:2px solid var(--navy);
    border-radius:30px;
    padding:6px 10px 6px 14px;
    font-weight:600;
    flex-wrap:wrap;
  }
  .team-chip .score{color:var(--navy-dark);min-width:52px;}
  .team-chip .adj-input{
    width:52px;
    padding:4px 6px;
    border-radius:6px;
    border:1px solid #c9cce5;
    font-size:.85rem;
    text-align:center;
  }
  .team-chip .adj-btn{
    border:none;
    width:26px;
    height:26px;
    border-radius:50%;
    cursor:pointer;
    font-size:1rem;
    font-weight:800;
    line-height:1;
    color:#fff;
  }
  .team-chip .adj-btn[data-action="plus"]{background:var(--green);}
  .team-chip .adj-btn[data-action="minus"]{background:var(--red);}
  .team-chip .del-btn{
    border:none;
    background:transparent;
    cursor:pointer;
    font-size:1rem;
    color:#999;
  }
  #addTeamForm{display:flex;gap:8px;margin-top:12px;}
  #addTeamForm input{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid #ccc;
    flex:1;
    min-width:120px;
  }
  #addTeamForm button, .primary-btn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
  }
  #addTeamForm button:hover, .primary-btn:hover{background:var(--navy-dark);}

  .board{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  @media (max-width:800px){
    .board{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:600px){
    .board{grid-template-columns:1fr;}
  }
  .category{
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 16px rgba(30,30,90,.08);
  }
  .cat-header{
    background:var(--navy);
    color:#fff;
    padding:12px 14px;
    font-weight:700;
    text-align:center;
    font-size:1rem;
  }
  .cell{
    background:var(--bg);
    border:none;
    border-bottom:1px solid #dfe2f5;
    width:100%;
    padding:16px;
    font-size:1.1rem;
    font-weight:700;
    color:var(--navy-dark);
    cursor:pointer;
    transition:.15s;
    text-align:center;
  }
  .cell:hover{background:#dfe3f7;}
  .cell.used{
    background:#e9e9ef;
    color:#b3b3c0;
    cursor:not-allowed;
    pointer-events:none;
  }

  .overlay{
    position:fixed;inset:0;
    background:rgba(20,22,60,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;
    border-radius:16px;
    max-width:520px;
    width:100%;
    padding:24px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .modal .points{
    color:var(--gold);
    font-weight:800;
    font-size:.9rem;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .modal h3{margin:6px 0 14px;color:var(--navy-dark);}
  .options{display:grid;gap:8px;margin-bottom:14px;}
  .option{
    padding:10px 14px;
    border:2px solid #dcdfef;
    border-radius:10px;
    cursor:pointer;
    background:#fafbff;
  }
  .option:hover{border-color:var(--navy);}
  .option.correct{background:#e7f7ef;border-color:var(--green);color:#1c7a49;font-weight:700;}
  .option.wrong{background:#fceaea;border-color:var(--red);color:#a52f2f;}
  .award-row{
    margin-top:16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .award-row select{
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
  }
  .close-btn{
    margin-top:14px;
    background:#eee;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    float:right;
  }
  footer{
    text-align:center;
    color:#8a8db0;
    font-size:.8rem;
    padding:20px;
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .tab-btn{
    background:var(--bg);
    border:2px solid var(--navy);
    color:var(--navy-dark);
    padding:10px 18px;
    border-radius:30px;
    font-weight:700;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--navy);
    color:#fff;
  }

  /* Jeu de mémoire */
  .memory-controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    margin-bottom:16px;
    font-size:.9rem;
  }
  .memory-controls select, .memory-controls input{
    padding:6px 8px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-left:6px;
  }
  .memory-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
  }
  @media (max-width:600px){
    .memory-grid{grid-template-columns:repeat(2, 1fr);}
  }
  .memory-card{
    aspect-ratio:1/1;
    perspective:800px;
    cursor:pointer;
  }
  .memory-card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .4s;
    transform-style:preserve-3d;
  }
  .memory-card.flipped .memory-card-inner,
  .memory-card.matched .memory-card-inner{
    transform:rotateY(180deg);
  }
  .memory-face{
    position:absolute;
    inset:0;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;
    font-weight:700;
    font-size:.85rem;
    backface-visibility:hidden;
  }
  .memory-face.front{
    background:var(--navy);
    color:var(--gold);
    font-size:1.6rem;
  }
  .memory-face.back{
    background:#fff;
    border:2px solid var(--navy);
    color:var(--navy-dark);
    transform:rotateY(180deg);
  }
  .memory-card.matched .memory-face.back{
    background:#e7f7ef;
    border-color:var(--green);
    color:#1c7a49;
  }

  /* Classement final */
  .rank-row{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:10px;
    font-weight:700;
  }
  .rank-row .medal{font-size:1.6rem;width:36px;text-align:center;}
  .rank-row .rname{flex:1;color:var(--navy-dark);}
  .rank-row .rscore{color:var(--gold);font-size:1.1rem;}
  .rank-row.first{
    background:linear-gradient(90deg,#fff7e0,var(--bg));
    border:2px solid var(--gold);
  }
  #confettiCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:80;
  }
</style>
</head>

<main>
  <div class="panel">
    <h2>Équipes</h2>
    <div class="teams" id="teamsWrap"></div>
    <div id="addTeamForm">
      <input type="text" id="newTeamName" placeholder="Nom du groupe (ex: Groupe A)">
      <button type="button" id="addTeamBtn">Ajouter</button>
    </div>
  </div>

// ---------- État ----------
let teams = [];
let usedCells = new Set();

// ---------- Rendu des équipes ----------
function renderTeams(){
  const wrap = document.getElementById('teamsWrap');
  wrap.innerHTML = '';
  teams.forEach((t, i)=>{
    const chip = document.createElement('div');
    chip.className = 'team-chip';
    chip.innerHTML = `<span>${t.name}</span><span class="score">${t.score} pts</span>
      <button type="button" class="adj-btn" data-action="minus" data-i="${i}" title="Retirer des points">−</button>
      <input type="number" class="adj-input" min="0" value="10">
      <button type="button" class="adj-btn" data-action="plus" data-i="${i}" title="Ajouter un bonus">+</button>
      <button type="button" class="del-btn" data-action="delete" data-i="${i}" title="Supprimer">✕</button>`;
    wrap.appendChild(chip);
  });
  refreshMemoryTeamSelect();
}

// Délégation d'événement : fonctionne même après chaque re-rendu de la liste
document.getElementById('teamsWrap').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-i]');
  if(!btn) return;
  const i = parseInt(btn.dataset.i, 10);
  const action = btn.dataset.action;

  if(action === 'delete'){
    teams.splice(i,1);
    renderTeams();
    return;
  }

  if(action === 'plus' || action === 'minus'){
    const chip = btn.closest('.team-chip');
    const input = chip.querySelector('.adj-input');
    let amount = parseInt(input.value, 10);
    if(isNaN(amount) || amount < 0) amount = 0;
    if(teams[i]){
      teams[i].score += (action === 'plus' ? amount : -amount);
      renderTeams();
    }
  }
});

function addTeam(){
  const input = document.getElementById('newTeamName');
  const name = input.value.trim();
  if(name){
    teams.push({name, score:0});
    input.value='';
    renderTeams();
    input.focus();
  }
}
document.getElementById('addTeamBtn').addEventListener('click', addTeam);
document.getElementById('newTeamName').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    addTeam();
  }
});

teams.push({name:'Groupe 1', score:0});
teams.push({name:'Groupe 2', score:0});

// ---------- Question modal ----------
const overlay = document.getElementById('overlay');
const modalPoints = document.getElementById('modalPoints');
const modalQuestion = document.getElementById('modalQuestion');
const modalOptions = document.getElementById('modalOptions');
const awardRow = document.getElementById('awardRow');
const awardTeamSelect = document.getElementById('awardTeamSelect');

let currentCellId = null;
let currentPoints = 0;

function openQuestion(ci, qi){
  const id = ci+'-'+qi;
  if(usedCells.has(id)) return;
  const qs = categories[ci].questions[qi];
  currentCellId = id;
  currentPoints = qs.points;

  // La question est retirée du jeu dès qu'elle est ouverte (gagnée ou perdue,
  // elle ne doit plus pouvoir être choisie par un autre groupe).
  usedCells.add(id);
  const cellBtn = document.querySelector(`.cell[data-id="${id}"]`);
  if(cellBtn){ cellBtn.classList.add('used'); cellBtn.textContent = '✓'; cellBtn.disabled = true; }

  modalPoints.textContent = categories[ci].name + ' · ' + qs.points + ' points';
  modalQuestion.textContent = qs.q;
  modalOptions.innerHTML = '';
  awardRow.style.display = 'none';

  qs.options.forEach((opt, oi)=>{
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.addEventListener('click', ()=>{
      document.querySelectorAll('.option').forEach((o,j)=>{
        if(j===qs.answer) o.classList.add('correct');
        else if(o===div && oi!==qs.answer) o.classList.add('wrong');
      });
      if(teams.length){
        awardTeamSelect.innerHTML = teams.map((t,ti)=>`<option value="${ti}">${t.name}</option>`).join('');
        awardRow.style.display = 'flex';
      }
    });
    modalOptions.appendChild(div);
  });

  overlay.classList.add('show');
}

// ---------- Jeu de mémoire ----------
const memoryPairs = [
  { term:"Souris", match:"Périphérique d'entrée" },
  { term:"Imprimante", match:"Périphérique de sortie" },
  { term:"RAM", match:"Mémoire vive (temporaire)" },
  { term:"Disque dur", match:"Stockage permanent" },
  { term:"Windows", match:"Système d'exploitation" },
  { term:"Wi-Fi", match:"Connexion sans fil" },
  { term:"URL", match:"Adresse d'une page web" },
  { term:"Antivirus", match:"Protection contre les virus" },
];

let memoryCards = [];
let flippedCards = [];
let lockBoard = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildMemoryDeck(){
  let deck = [];
  memoryPairs.forEach((p, pi)=>{
    deck.push({ pairId: pi, text: p.term });
    deck.push({ pairId: pi, text: p.match });
  });
  deck = shuffle(deck);
  return deck.map((c, idx)=>({ ...c, idx, matched:false, flipped:false }));
}

function renderMemoryGrid(){
  const grid = document.getElementById('memoryGrid');
  grid.innerHTML = '';
  memoryCards.forEach(card=>{
    const cardEl = document.createElement('div');
    cardEl.className = 'memory-card';
    cardEl.dataset.idx = card.idx;
    cardEl.innerHTML = `
      <div class="memory-card-inner">
        <div class="memory-face front">?</div>
        <div class="memory-face back">${card.text}</div>
      </div>`;
    cardEl.addEventListener('click', ()=> flipMemoryCard(card.idx));
    grid.appendChild(cardEl);
  });
}

function resetMemoryGame(){
  memoryCards = buildMemoryDeck();
  flippedCards = [];
  lockBoard = false;
  renderMemoryGrid();
}

function flipMemoryCard(idx){
  if(lockBoard) return;
  const card = memoryCards[idx];
  if(card.matched || card.flipped) return;
  if(flippedCards.length >= 2) return;

  card.flipped = true;
  updateMemoryCardEl(card);
  flippedCards.push(card);

  if(flippedCards.length === 2){
    lockBoard = true;
    const [a, b] = flippedCards;
    if(a.pairId === b.pairId){
      a.matched = true; b.matched = true;
      updateMemoryCardEl(a); updateMemoryCardEl(b);
      awardMemoryPoints();
      flippedCards = [];
      lockBoard = false;
    } else {
      setTimeout(()=>{
        a.flipped = false; b.flipped = false;
        updateMemoryCardEl(a); updateMemoryCardEl(b);
        flippedCards = [];
        lockBoard = false;
      }, 900);
    }
  }
}

function updateMemoryCardEl(card){
  const el = document.querySelector(`.memory-card[data-idx="${card.idx}"]`);
  if(!el) return;
  el.classList.toggle('flipped', card.flipped && !card.matched);
  el.classList.toggle('matched', card.matched);
}

function awardMemoryPoints(){
  const select = document.getElementById('memoryTeamSelect');
  const ti = parseInt(select.value, 10);
  let pts = parseInt(document.getElementById('memoryPoints').value, 10);
  if(isNaN(pts) || pts < 0) pts = 0;
  if(!isNaN(ti) && teams[ti]){
    teams[ti].score += pts;
    renderTeams();
    select.value = ti; // garder la sélection après le re-rendu du select
  }
}

function refreshMemoryTeamSelect(){
  const select = document.getElementById('memoryTeamSelect');
  if(!select) return;
  const prev = select.value;
  select.innerHTML = teams.map((t,ti)=>`<option value="${ti}">${t.name}</option>`).join('');
  if(prev !== '' && teams[parseInt(prev,10)]) select.value = prev;
}

document.getElementById('memoryResetBtn').addEventListener('click', resetMemoryGame);

resetMemoryGame();

// ---------- Classement final ----------
function renderRanking(){
  const list = document.getElementById('rankingList');
  if(teams.length === 0){
    list.innerHTML = '<p>Ajoutez des groupes pour voir le classement.</p>';
    return;
  }
  const sorted = teams.slice().sort((a,b)=> b.score - a.score);
  const medals = ['🥇','🥈','🥉'];
  list.innerHTML = sorted.map((t,i)=>{
    const medal = medals[i] || (i+1)+'.';
    return `<div class="rank-row ${i===0 ? 'first' : ''}">
      <span class="medal">${medal}</span>
      <span class="rname">${t.name}</span>
      <span class="rscore">${t.score} pts</span>
    </div>`;
  }).join('');
}

// ---------- Confetti (célébration du vainqueur) ----------
const confettiCanvas = document.getElementById('confettiCanvas');
const ctx = confettiCanvas.getContext('2d');
function resizeConfettiCanvas(){
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfettiCanvas);
resizeConfettiCanvas();

function launchConfetti(){
  const colors = ['#e0b84b','#2b2f7e','#3bb273','#e15554','#f2a65a'];
  const pieces = [];
  const count = 140;
  for(let i=0; i<count; i++){
    pieces.push({
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * confettiCanvas.height * 0.5,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      color: colors[Math.floor(Math.random()*colors.length)],
      speed: 2 + Math.random() * 3,
      drift: (Math.random() - 0.5) * 2,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
    });
  }
  const duration = 3200;
  const start = performance.now();

  function frame(now){
    const elapsed = now - start;
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    pieces.forEach(p=>{
      p.y += p.speed;
      p.x += p.drift;
      p.rotation += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if(elapsed < duration){
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }
  requestAnimationFrame(frame);
}

document.getElementById('celebrateBtn').addEventListener('click', ()=>{
  renderRanking();
  launchConfetti();
});
</script>
